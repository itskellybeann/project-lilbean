version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      USER1_EMAIL: ${USER1_EMAIL}
      USER1_NAME: ${USER1_NAME}
      USER1_PASSWORD: ${USER1_PASSWORD}
      USER2_EMAIL: ${USER2_EMAIL}
      USER2_NAME: ${USER2_NAME}
      USER2_PASSWORD: ${USER2_PASSWORD}
      NODE_ENV: production
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      REMINDER_CRON: ${REMINDER_CRON}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./data/uploads:/app/uploads

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Override with WEB_PORT in .env if 8080 is already taken on your NAS —
      # that file isn't part of this repo, so the override survives updates.
      - "${WEB_PORT:-8080}:8080"

  db-backup:
    build: ./backup
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - ./backups:/backups
